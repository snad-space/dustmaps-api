name: Test

on:
  pull_request:
  push:

jobs:
  app-tests:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo test --manifest-path app/Cargo.toml

  data-prep-tests:
    name: Data-prep unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: data-prep/uv.lock
      - run: uv run --project data-prep --group test pytest -q data-prep/tests

  golden:
    name: Docker golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: golden-tests
          tags: dustmaps-api:golden-tests
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm dustmaps-api:golden-tests
