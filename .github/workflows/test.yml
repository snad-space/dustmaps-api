name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-tests:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo test --manifest-path app/Cargo.toml

  data-prep-tests:
    name: Data-prep unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: data-prep/uv.lock
      - run: uv run --project data-prep --group test pytest -q data-prep/tests

  golden:
    name: Map golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            data-prep/uv.lock
            integration-tests/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: uv run --project data-prep python -m data_prep.build --out /tmp/dustmaps-data
      - run: cargo build --release --manifest-path app/Cargo.toml
      - run: |
          DUSTMAPS_DATA_DIR=/tmp/dustmaps-data DUSTMAPS_LISTEN_ADDR=127.0.0.1:18080 app/target/release/dustmaps-api >/tmp/dustmaps-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/api/v1/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/v1/health
      - run: >-
          DUSTMAPS_API_URL=http://127.0.0.1:18080
          CSFD_FITS=/tmp/dustmaps-data/raw/csfd_ebv.fits
          BAYESTAR_H5=/tmp/dustmaps-data/raw/bayestar2019-bestfit.h5
          uv run --project integration-tests pytest -q integration-tests/tests
