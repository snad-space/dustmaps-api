[project]
name = "dustmaps-api-prep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1,<9",
    "cdshealpix>=0.8.1,<0.9",
    "dustmaps>=1.0",
    "h5py>=3,<4",
    "numpy>=2,<3",
]

[dependency-groups]
test = ["pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_prep"]
