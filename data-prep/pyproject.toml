[project]
name = "dustmaps-api-prep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7,<8",
    "dustmaps>=1.0",
    "numpy>=2,<3",
]

[dependency-groups]
test = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_prep"]
